<section class="section"><div class="container"><div class="eyebrow">HOW IT WORKS</div><h2>Four steps. That's it.</h2><p class="section-lead">Everything stays in one place from screenshot upload to your generated estimate.</p><div class="public-steps"><div class="card public-step"><span>01</span><div><h3>Open the app</h3><p>Sign in to your Prediction Center when you're ready to use the service.</p></div></div><div class="card public-step"><span>02</span><div><h3>Take a screenshot</h3><p>Capture the virtual-football fixtures shown on your phone.</p></div></div><div class="card public-step"><span>03</span><div><h3>Upload it</h3><p>Choose a clear PNG, JPG or WEBP screenshot for verification.</p></div></div><div class="card public-step"><span>04</span><div><h3>Receive insights</h3><p>After the scan, a predefined AI-assisted prediction set is displayed.</p></div></div></div></div></section>

function auth(signup){return `<main class="auth"><div class="card authcard"><a class="brand" href="#home"><span class="mark">IP</span><span>INSTANT PREDICTION</span></a><h1>${signup?"Create your account":"Welcome back"}</h1><p>${signup?"Set up your account and access your Prediction Center.":"Sign in to continue to your Prediction Center."}</p><form onsubmit="${signup?"signupUser(event)":"loginUser(event)"}">${signup?'<div class="field"><label>Full name</label><input id="name" autocomplete="name" required></div>':""}<div class="field"><label>Email address</label><input id="email" type="email" autocomplete="email" required></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" minlength="6" required></div><button class="btn red" style="width:100%">${signup?"Create account":"Sign in"}</button></form><p style="text-align:center">${signup?'Already have an account? <a style="color:var(--primary)" href="#login">Sign in</a>':'New here? <a style="color:var(--primary)" href="#signup">Create an account</a>'}</p><p style="font-size:12px;text-align:center;color:#78909a">18+ only · Play responsibly.</p></div></main>`}
async function dashboard(){
  if(!user){location.hash="login";return""}
  await loadProfile();
  const p=profile||{};
  const homeTarget=profile?.role==="admin"?"#user-dashboard":"#dashboard";
  const connectedKey="instant_prediction_connected_"+(user.id||user.email);
  const savedUsername=sessionStorage.getItem(connectedKey)||"";
  const connected=!!savedUsername;
  return nav()+`<main class="dashboard"><div class="container">
    <div class="eyebrow">PREDICTION CENTER</div><h1>Welcome back</h1>
    <p class="welcome-line">${esc(p.full_name||user.email)} · Your dashboard is ready for your next screenshot verification.</p>
    <div class="actions"><a class="btn ghost" href="${homeTarget}">⌂ Home</a><a class="btn red" href="#packages">Buy diamonds</a></div>
    <div class="metrics"><div class="card metric"><span>DIAMOND BALANCE</span><b class="diamond-value">💎 ${p.diamond_balance??0}</b></div><div class="card metric"><span>ACCOUNT STATUS</span><b class="ok">${esc(p.account_status||"ACTIVE")}</b></div><div class="card metric"><span>ANALYSES RUN</span><b>${p.analyses_run??0}</b></div></div>

    <section class="account-connect-card" aria-label="Betting account connection">
      <h2 class="account-connect-title">Enter your betting account username <span>(eg. alex123)</span></h2>
      <div id="connectedSuccess" class="connected-success ${connected?'show':''}">Betting account connected successfully. ⭐</div>
      <div id="accountConnectRow" class="account-connect-row" style="${connected?'display:none':''}">
        <div class="account-connect-field">
          <input id="bettingUsername" value="${connected?'':esc(savedUsername)}" placeholder="Enter your betting account username" autocomplete="off" maxlength="80"
            oninput="document.getElementById('connectBettingBtn').disabled=!this.value.trim()">
        </div>
        <button id="connectBettingBtn" class="connect-btn" type="button" onclick="connectBettingAccount()" ${connected?'disabled':''}>Connect</button>
      </div>
      <div id="connectionStatus" class="connection-status" style="${connected?'display:none':''}"></div>

function formatAdminDate(value){
  if(!value)return "—";
  try{
    return new Intl.DateTimeFormat("en-GB",{
      day:"2-digit",month:"short",year:"numeric",
      hour:"2-digit",minute:"2-digit",second:"2-digit",
      hour12:false,timeZone:"Africa/Accra"
    }).format(new Date(value))+" GMT";
  }catch(e){return String(value)}
}

async function copyPaymentAmount(amount){const value=String(amount);try{await navigator.clipboard.writeText(value);alert("Payment amount copied: GH₵"+value)}catch(e){const ta=document.createElement("textarea");ta.value=value;document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove();alert("Payment amount copied: GH₵"+value)}}
async function copyPaymentNumber(){const number=PAYMENT.number;try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(number)}else{const ta=document.createElement("textarea");ta.value=number;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove()}}catch(e){const ta=document.createElement("textarea");ta.value=number;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove()}}

}

async function adminAdjustDiamonds(delta){if(!user||profile?.role!=="admin"){alert("Admin access required.");return}const input=document.getElementById("adminDiamondAmount"),msg=document.getElementById("adminDiamondMsg");const amount=Number(input?.value);if(!Number.isInteger(amount)||amount<1){if(msg){msg.className="err";msg.textContent="Enter a whole number of diamonds greater than 0."}return}const action=delta>0?"credit":"deduct";if(!confirm(`Are you sure you want to ${action} ${amount} diamonds ${delta>0?"to":"from"} the admin account?`))return;if(msg){msg.className="";msg.textContent="Updating admin diamond balance…"}const r=await sb.rpc("admin_adjust_diamonds",{p_delta:delta*amount});if(r.error){if(msg){msg.className="err";msg.textContent="Diamond update failed: "+r.error.message}return}const newBalance=Number(Array.isArray(r.data)?r.data[0]?.diamond_balance:r.data?.diamond_balance);await loadProfile();if(msg){msg.className="success";msg.textContent=`Admin balance updated successfully. Current balance: 💎 ${Number.isFinite(newBalance)?newBalance:Number(profile?.diamond_balance||0)}`}await render()}
async function adminCreditDiamonds(){return adminAdjustDiamonds(1)}

async function connectBettingAccount(){
  if(!user){location.hash="login";return}
  const input=document.getElementById("bettingUsername"),btn=document.getElementById("connectBettingBtn"),status=document.getElementById("connectionStatus"),success=document.getElementById("connectedSuccess"),section=document.getElementById("screenshotSection");
  const username=(input?.value||"").trim();
  if(!username){if(status){status.className="connection-status error";status.textContent="Please enter your betting account username first."}return}
  if(btn){btn.disabled=true;btn.innerHTML='<span class="btn-spinner"></span> Connect'}
  if(status){status.className="connection-status";status.textContent="Connecting securely…";status.style.display="block"}
  if(success)success.classList.remove("show");
  if(section)section.classList.remove("show");
  // Exactly five seconds before the connected state is shown. This is only a UI sync state; it does not access an external sportsbook account.
  await new Promise(r=>setTimeout(r,5000));
  sessionStorage.setItem("instant_prediction_connected_"+(user.id||user.email),username);
  const row=document.getElementById("accountConnectRow");
  if(row)row.style.display="none";
  if(success){success.classList.add("show");success.textContent="Betting account connected successfully. ⭐"}
  if(status)status.style.display="none";
  if(section)section.classList.add("show");
  section?.scrollIntoView({behavior:"smooth",block:"start"});
}

  const btn=document.getElementById("an"),upload=document.querySelector(".reference-upload"),refFrame=document.getElementById("referenceFrame"),scanStatus=document.getElementById("referenceScanStatus"),counter=document.getElementById("referenceCounter");

  // Keep the visual scan running for the full 10 seconds.
  for(let i=1;i<=10;i++){
    await new Promise(r=>setTimeout(r,1000));

    if(scanStatus)scanStatus.innerHTML=`<span class="scan-dot"></span> Scanning screenshot for matches… ${pct}%`;
  }

  }
  await loadProfile();
  const selected=PREDICTION_SETS[Math.floor(Math.random()*PREDICTION_SETS.length)];

    <div class="results-panel" style="display:block!important;visibility:visible!important;opacity:1!important;position:relative;z-index:5;">
      <div class="results-title">RESULTS</div>
      <div class="results-head"><span>Match</span><span>Predicted Outcome ⭐</span></div>
      <div id="resultsRows">${picks.map((x,i)=>`<div class="result-loading" id="resultLoading${i}"><span></span><span></span></div>`).join('')}</div>
      <div class="results-foot">Keep playing to unlock your eligibility for <strong>BIG ODDS</strong>.</div>
    </div>`;
  if(resultStage){
    resultStage.hidden=false;
    resultStage.removeAttribute("hidden");
    resultStage.style.cssText="display:block!important;width:100%;margin-top:22px;visibility:visible!important;opacity:1!important;";
    resultStage.innerHTML=resultsMarkup;
  }else if(section){
    const fallback=document.createElement("div");

    fallback.className="result-stage";
    fallback.style.cssText="display:block!important;width:100%;margin-top:22px;visibility:visible!important;opacity:1!important;";

    section.appendChild(fallback);
  }

    row.outerHTML=`<div class="result-row"><div>Match ${i+1}</div><div><span class="result-arrow">⟶</span>${outcome}</div></div>`;
  }

function previewProof(e){const f=e.target.files?.[0];const box=document.getElementById("proofPrev");if(!f||!box)return;box.innerHTML=`<img class="proof-preview" src="${URL.createObjectURL(f)}" alt="Payment screenshot preview">`}
async function imageToDataUrl(file,max=1000){return await new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>{const scale=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));const ctx=c.getContext('2d');ctx.drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',0.72))};img.onerror=reject;img.src=URL.createObjectURL(file)})}
async function submitPayment(e,name,amount){

const proofFile=document.getElementById("proof")?.files?.[0];if(!proofFile){m.className="error";m.textContent="Please upload your payment screenshot.";form?.removeAttribute("data-busy");if(submitBtn){submitBtn.disabled=false;submitBtn.classList.remove("is-busy");submitBtn.textContent=submitBtn.dataset.originalText||"SUBMIT PAYMENT PROOF"}return}
try{
 const proofData=await imageToDataUrl(proofFile);
 const pkg=await sb.from("packages").select("id").eq("name",name).single();
 if(pkg.error||!pkg.data){m.className="error";m.textContent="Package could not be found. Please try again.";form?.removeAttribute("data-busy");if(submitBtn){submitBtn.disabled=false;submitBtn.classList.remove("is-busy");submitBtn.textContent=submitBtn.dataset.originalText||"SUBMIT PAYMENT PROOF"}return}
 m.textContent="Submitting payment for admin verification…";
 const r=await sb.from("payments").insert({user_id:user.id,package_id:pkg.data.id,amount_ghs:p.price,payment_method:"MTN",transaction_reference:document.getElementById("ref").value.trim(),proof_url:proofData,payer_email:user.email,status:"pending",admin_note:["Sender name: "+document.getElementById("senderName")?.value.trim(),"Momo number: "+document.getElementById("phone")?.value.trim(),document.getElementById("note")?.value.trim()].filter(Boolean).join(" | ")});
 if(r.error){m.className="error";m.textContent=r.error.message;form?.removeAttribute("data-busy");if(submitBtn){submitBtn.disabled=false;submitBtn.classList.remove("is-busy");submitBtn.textContent=submitBtn.dataset.originalText||"SUBMIT PAYMENT PROOF"}return}
 m.className="success";const returnHash=(profile?.role==="admin"?"#user-dashboard":"#dashboard");m.innerHTML='Payment submitted successfully. Admin approval is required before diamonds are credited.<div class="actions"><a class="btn red homebtn" href="'+returnHash+'">⌂ GO TO HOME</a><a class="btn ghost homebtn" href="'+returnHash+'">OPEN PREDICTION CENTER</a></div>';
}catch(err){m.className="error";m.textContent="Could not prepare the payment screenshot. Please choose the screenshot again.";form?.removeAttribute("data-busy");if(submitBtn){submitBtn.disabled=false;submitBtn.classList.remove("is-busy");submitBtn.textContent=submitBtn.dataset.originalText||"SUBMIT PAYMENT PROOF"}}
}
async function render(){
  let h=location.hash.slice(1)||"home";

  // Logged-in users must stay inside the private Prediction Center.
  // The public landing page is only shown when there is no active session.
  if(h==="home" && user){
    h=profile?.role==="admin"?"user-dashboard":"dashboard";
    if(location.hash!=="#"+h) history.replaceState(null,"","#"+h);
  }

  if((h==="dashboard"||h==="user-dashboard"||h==="admin"||h.startsWith("payment-"))&&!user){
    if(location.hash!=="#login") location.hash="login";
    app.innerHTML=auth(false);
    return;
  }

  if(h==="dashboard")app.innerHTML=await dashboard(false);
  else if(h==="user-dashboard")app.innerHTML=await dashboard();
  else if(h==="packages")app.innerHTML=packages();
  else if(h==="admin")app.innerHTML=await adminDashboard();
  else if(h==="signup")app.innerHTML=auth(true);
  else if(h==="login")app.innerHTML=auth(false);
  else if(h.startsWith("payment-"))app.innerHTML=payment(decodeURIComponent(h.slice(8)));
  else app.innerHTML=home();
}
window.addEventListener("hashchange",render);
(async()=>{const r=await sb.auth.getSession();user=r.data.session?.user||null;if(user)await loadProfile();render()})();
